<div class="register">
  <div class="register-box">

    <h1>Create Account</h1>

    <form (ngSubmit)="register()">

      <div class="input-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
          placeholder="Enter your username"
          minlength="3"
          maxlength="24"
          required
        >
      </div>

      <div class="input-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          placeholder="Enter your email"
          maxlength="255"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="new-password"
          placeholder="Enter your password"
          minlength="8"
          maxlength="72"
          required
        >
      </div>

      <small class="password-help">Use at least 8 characters.</small>

      <button type="submit">
        Register
      </button>

    </form>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <p class="success" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <p class="login-text">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>
</div>
